# Railway deployment configuration
# https://railway.com/docs/config
#
# IMPORTANT: Do NOT set "Root Directory" to "backend" in Railway settings.
# The server serves frontend from ../frontend (relative to backend),
# so the whole repository must be the build context.

[build]
builder = "nixpacks"

[phases.setup]
nixPkgs = ["nodejs_20", "npm"]

[phases.install]
cmds = ["cd backend && npm install"]

[phases.build]
dependsOn = ["install"]

[start]
cmd = "cd backend && node server.js"
